<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WHY do we do it?</title>
  <link rel="icon" type="image/png" href="Assets/main_logo.png" />

  <!-- Google Fonts: Geometric tech display -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Michroma&family=Orbitron:wght@400;500;700;800&family=Space+Grotesk:wght@300;400;500;700&display=swap" rel="stylesheet">

  <style>
    /* -------------------------------------------------------------
       DESIGN TOKENS
    ------------------------------------------------------------- */
    :root {
      --bg-color: #b50505;
      --bg-invert: #ffffff;
      --text-color: #ffffff;
      --red-accent: #b50505;
      --font-display: 'Michroma', sans-serif;
      --page-padding: 3rem 4rem;
      --transition-core: 0.35s cubic-bezier(0.25, 1, 0.5, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: var(--font-display);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: var(--page-padding);
      transition: background-color var(--transition-core);
    }

    /* -------------------------------------------------------------
       INVERSION / WHITE-OUT STATE
    ------------------------------------------------------------- */
    body.is-spotlight {
      background-color: #f5e2e2;
    }

    /* Everything marked .fade-target smoothly vanishes */
    body.is-spotlight .fade-target {
      opacity: 0;
      pointer-events: none;
    }

    /* -------------------------------------------------------------
       BUTTON & INTERACTIVE BASE
    ------------------------------------------------------------- */
    .interactive {
      display: inline-block;
      background: none;
      border: none;
      padding: 0;
      margin: 0;
      font: inherit;
      color: inherit;
      text-decoration: none;
      cursor: pointer;
      position: relative;
      transition: opacity var(--transition-core), transform var(--transition-core);
    }

    .interactive:focus-visible {
      outline: 2px dashed currentColor;
      outline-offset: 4px;
    }

    /* -------------------------------------------------------------
       TOP NAVIGATION BAR
    ------------------------------------------------------------- */
    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      flex-shrink: 0;
      z-index: 50;
      background: transparent;
      transition: opacity var(--transition-core);
    }

    .nav-back {
      background: none;
      border: none;
      color: var(--text-color);
      cursor: pointer;
      display: flex;
      align-items: center;
      transition: transform 0.2s ease;
    }

    .nav-back:hover {
      transform: translateX(-4px);
    }

    .nav-back svg {
      width: 38px;
      height: 24px;
      stroke: currentColor;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 3.5rem;
      list-style: none;
    }

    .nav-links a {
      color: var(--text-color);
      text-decoration: none;
      font-size: 1.15rem;
      letter-spacing: 0.08em;
      transition: opacity 0.2s ease;
    }

    .nav-links a:hover {
      opacity: 0.75;
    }

    .nav-links .home-icon svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      vertical-align: middle;
    }

    /* -------------------------------------------------------------
       PAGE TITLE: "WHY do we do it ?"
    ------------------------------------------------------------- */
    .page-header {
      margin-top: 1.8rem;
      margin-bottom: 1.5rem;
      flex-shrink: 0;
      background: transparent;
      transition: opacity var(--transition-core);
    }

    .heading-large {
      font-size: 3.8rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      line-height: 1.1;
      display: flex;
      align-items: baseline;
      gap: 1rem;
    }

    .heading-large .sub-inline {
      font-size: 1.45rem;
      font-weight: 400;
      letter-spacing: 0.02em;
    }

    /* -------------------------------------------------------------
       MAIN STAGE & CENTER EDITORIAL STATEMENT
    ------------------------------------------------------------- */
    .main-stage {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      min-height: 0;
    }

    .statement-container {
      max-width: 1040px;
      margin: 0 auto 3rem auto;
      user-select: none;
    }

    .statement-line {
      font-size: 1.45rem;
      line-height: 1.8;
      letter-spacing: 0.02em;
      font-weight: 400;
      transition: opacity var(--transition-core);
      display: block;
    }

    .statement-line-split {
      display: flex;
      align-items: baseline;
      gap: 0.8rem;
      flex-wrap: wrap;
    }

    /* -------------------------------------------------------------
       SPOTLIGHT ELEMENT 1: "deliver nothing but the best."
    ------------------------------------------------------------- */
    .best-btn {
      display: inline-block;
      font-size: 2.25rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      line-height: 1.2;
      color: var(--text-color);
      cursor: pointer;
      position: relative;
      transition: color var(--transition-core), opacity var(--transition-core);
    }

    /* Underline setup */
    .best-btn::after {
      content: '';
      position: absolute;
      left: 0;
      bottom: -6px;
      width: 100%;
      height: 3.5px;
      background-color: var(--red-accent);
      transform: scaleX(0);
      transform-origin: right;
      transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1);
    }

    /* -------------------------------------------------------------
       SPOTLIGHT ELEMENT 2: "JOURNEY SO FAR"
    ------------------------------------------------------------- */
    .journey-rail {
      position: absolute;
      bottom: 2rem;
      right: 0;
      text-align: right;
      user-select: none;
      z-index: 20;
    }

    .journey-btn {
      display: inline-block;
      font-size: 2.1rem;
      line-height: 1.35;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: var(--text-color);
      text-decoration: none;
      cursor: pointer;
      position: relative;
      transition: color var(--transition-core), opacity var(--transition-core);
    }

    /* Underline setup */
    .journey-btn::after {
      content: '';
      position: absolute;
      left: 0;
      bottom: -4px;
      width: 100%;
      height: 3px;
      background-color: var(--red-accent);
      transform: scaleX(0);
      transform-origin: right;
      transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1);
    }

    /* -------------------------------------------------------------
       SPOTLIGHT & MUTUAL OPACITY (0.35) BEHAVIOR
    ------------------------------------------------------------- */
    /* When spotlight is active, both turn red */
    body.is-spotlight .best-btn,
    body.is-spotlight .journey-btn {
      color: var(--red-accent);
    }

    /* Hovering "deliver nothing but the best" */
    body.hover-best #journeyBtn {
      opacity: 0.35;
    }
    body.hover-best #bestBtn {
      opacity: 1;
    }
    body.hover-best #bestBtn::after {
      transform: scaleX(1);
      transform-origin: left;
    }

    /* Hovering "JOURNEY SO FAR" */
    body.hover-journey #bestBtn {
      opacity: 0.35;
    }
    body.hover-journey #journeyBtn {
      opacity: 1;
    }
    body.hover-journey #journeyBtn::after {
      transform: scaleX(1);
      transform-origin: left;
    }

    /* -------------------------------------------------------------
       RESPONSIVE ADAPTATIONS
    ------------------------------------------------------------- */
    @media (max-width: 1100px) {
      body {
        height: auto;
        overflow-y: auto;
        padding: 2rem 1.5rem;
      }
      .heading-large {
        font-size: 2.8rem;
      }
      .heading-large .sub-inline {
        font-size: 1.2rem;
      }
      .statement-container {
        margin: 3rem 0;
      }
      .statement-line {
        font-size: 1.25rem;
        line-height: 1.6;
      }
      .best-btn {
        font-size: 1.75rem;
      }
      .journey-rail {
        position: relative;
        bottom: auto;
        margin-top: 2rem;
        text-align: left;
      }
      .journey-btn {
        font-size: 1.7rem;
      }
    }
  </style>
</head>
<body>

  <!-- Top Navigation (Fades out on spotlight) -->
  <header class="top-nav fade-target">
    <button class="nav-back" aria-label="Go back" onclick="history.back()">
      <svg viewBox="0 0 40 24">
        <line x1="38" y1="12" x2="4" y2="12"></line>
        <polyline points="14 3 3 12 14 21"></polyline>
      </svg>
    </button>

    <nav>
      <ul class="nav-links">
        <li><a href="contact.html" class="interactive">CONTACT</a></li>
        <li><a href="what.html" class="interactive">WHAT</a></li>
        <li><a href="how.html" class="interactive">HOW</a></li>
        <li>
          <a href="index.html" class="interactive home-icon" aria-label="Home">
            <svg viewBox="0 0 24 24">
              <path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1V9.5z"></path>
            </svg>
          </a>
        </li>
      </ul>
    </nav>
  </header>

  <!-- Title Header (Fades out on spotlight) -->
  <div class="page-header fade-target">
    <h1 class="heading-large">
      WHY <span class="sub-inline">do we do it ?</span>
    </h1>
  </div>

  <!-- Main Stage: Center Statement -->
  <main class="main-stage">

    <div class="statement-container">
      <span class="statement-line fade-target">
        The moment being 'good' started to feel ordinary, a hustle began
      </span>
      <span class="statement-line fade-target">
        to ace the race. We do it for the zeal to excel, the belief to achieve
      </span>
      <div class="statement-line statement-line-split">
        <span class="fade-target">and the drive to</span>
        <!-- Spotlight Element 1 -->
        <a href="clients-projects.html" class="best-btn interactive" id="bestBtn">
          deliver nothing but the best.
        </a>
      </div>
    </div>

    <!-- Spotlight Element 2: Lower-Right Rail -->
    <aside class="journey-rail">
      <a href="journey.html" class="journey-btn interactive" id="journeyBtn">
        THE JOURNEY<br>SO FAR
      </a>
    </aside>

  </main>

  <script>
    (function () {
      var body = document.body;
      var bestBtn = document.getElementById('bestBtn');
      var journeyBtn = document.getElementById('journeyBtn');

      /* Spotlight for "deliver nothing but the best." */
      bestBtn.addEventListener('mouseenter', function () {
        body.classList.add('is-spotlight', 'hover-best');
      });
      bestBtn.addEventListener('mouseleave', function () {
        body.classList.remove('is-spotlight', 'hover-best');
      });
      bestBtn.addEventListener('focus', function () {
        body.classList.add('is-spotlight', 'hover-best');
      });
      bestBtn.addEventListener('blur', function () {
        body.classList.remove('is-spotlight', 'hover-best');
      });

      /* Spotlight for "JOURNEY SO FAR" */
      journeyBtn.addEventListener('mouseenter', function () {
        body.classList.add('is-spotlight', 'hover-journey');
      });
      journeyBtn.addEventListener('mouseleave', function () {
        body.classList.remove('is-spotlight', 'hover-journey');
      });
      journeyBtn.addEventListener('focus', function () {
        body.classList.add('is-spotlight', 'hover-journey');
      });
      journeyBtn.addEventListener('blur', function () {
        body.classList.remove('is-spotlight', 'hover-journey');
      });
    })();
  </script>
  <script src="nav.js"></script>

</body>
</html>
