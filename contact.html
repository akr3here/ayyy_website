<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Page</title>
  <link rel="icon" type="image/png" href="Assets/main_logo.png" />

  <!-- Google Fonts: Consistent across all pages -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Michroma&family=Orbitron:wght@400;500;700;800&family=Space+Grotesk:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    /* -------------------------------------------------------------
       UNIFORM THEME & DESIGN TOKENS
    ------------------------------------------------------------- */
    :root {
      --bg-color: #b50505;
      --text-color: #ffffff;
      --font-display: 'Michroma', sans-serif;
      --font-body: 'Michroma', sans-serif;
      --transition-smooth: 0.2s ease;
      --page-padding: 3rem 4rem;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow-x: hidden;
      padding: var(--page-padding);
      position: relative;
    }

    /* -------------------------------------------------------------
       BUTTON / INTERACTION UTILITY (Convertible Elements)
    ------------------------------------------------------------- */
    .char-btn,
    .interactive {
      display: inline-block;
      background: none;
      border: none;
      padding: 0;
      margin: 0;
      font: inherit;
      color: inherit;
      text-decoration: none;
      cursor: pointer;
      position: relative;
      transition: transform var(--transition-smooth), opacity var(--transition-smooth), color var(--transition-smooth);
    }

    .char-btn:hover,
    .interactive:hover {
      opacity: 0.8;
      transform: translateY(-2px);
    }

    .char-btn:focus-visible,
    .interactive:focus-visible {
      outline: 2px dashed #ffffff;
      outline-offset: 4px;
    }

    /* -------------------------------------------------------------
       TOP NAVIGATION BAR (Exact uniform dimensions)
    ------------------------------------------------------------- */
    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    .nav-back {
      background: none;
      border: none;
      color: var(--text-color);
      cursor: pointer;
      display: flex;
      align-items: center;
      transition: transform var(--transition-smooth);
    }

    .nav-back:hover {
      transform: translateX(-4px);
    }

    .nav-back svg {
      width: 38px;
      height: 24px;
      stroke: currentColor;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 3.5rem;
      list-style: none;
    }

    .nav-links a {
      color: var(--text-color);
      text-decoration: none;
      font-size: 1.15rem;
      letter-spacing: 0.08em;
      transition: opacity var(--transition-smooth);
    }

    .nav-links a:hover {
      opacity: 0.75;
    }

    .nav-links .home-icon svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      vertical-align: middle;
    }

    /* -------------------------------------------------------------
       TITLE SECTION (Exact uniform baseline and scale)
    ------------------------------------------------------------- */
    .header-section {
      margin-top: 3.5rem;
      display: flex;
      align-items: baseline;
      width: 100%;
    }

    .heading-large {
      font-size: 5rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      line-height: 1;
    }

    .char-item {
      display: inline-block;
    }

    /* -------------------------------------------------------------
       CENTER SECTION (Message Prompt)
    ------------------------------------------------------------- */
    .main-content {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: left;
      flex-grow: 1;
      padding: 3rem 0;
      margin: 0 auto;
      max-width: 850px;
      width: 100%;
    }

    .contact-message {
      font-size: 1.7rem;
      line-height: 1.65;
      letter-spacing: 0.04em;
      font-weight: 400;
      width: 100%;
    }

    /* -------------------------------------------------------------
       BOTTOM ICONS ROW (Instagram, LinkedIn, Web, Email)
    ------------------------------------------------------------- */
    .bottom-section {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      padding-top: 2rem;
      padding-bottom: 0.5rem;
    }

    .social-icon-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-color);
      width: 7.5rem;
      height: 7.5rem;
      cursor: pointer;
      transition: transform var(--transition-smooth), opacity var(--transition-smooth);
    }

    .social-icon-btn svg {
      width: 100%;
      height: 100%;
      fill: currentColor;
    }

    .social-icon-btn:hover {
      opacity: 0.85;
      transform: translateY(-4px);
    }

    /* -------------------------------------------------------------
       RESPONSIVE ADJUSTMENTS
    ------------------------------------------------------------- */
    @media (max-width: 992px) {
      body {
        padding: 2rem 1.5rem;
      }
      .nav-links {
        gap: 1.5rem;
        font-size: 0.95rem;
      }
      .heading-large {
        font-size: 3.5rem;
      }
      .contact-message {
        font-size: 1.25rem;
      }
      .social-icon-btn {
        width: 4.5rem;
        height: 4.5rem;
      }
    }

    @media (max-width: 580px) {
      .heading-large {
        font-size: 2.8rem;
      }
      .social-icon-btn {
        width: 3.2rem;
        height: 3.2rem;
      }
      .nav-links {
        gap: 1rem;
      }
    }
  </style>
</head>
